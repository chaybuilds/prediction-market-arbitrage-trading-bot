name: Chay Trades Terminal Safety Checks
on:
  push:
    branches: ["feature/chay-trades-arb-terminal-v01"]
  pull_request:
permissions:
  contents: read
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install research-only requirements
        run: python -m pip install -r requirements.txt
      - name: Original fork's unit tests and Chay integration
        run: python -m pytest -q
      - name: JavaScript syntax
        run: |
          node --check terminal/app.js
          node --check terminal/engine.js
          node --check terminal/poly-us.js
          node --check terminal/btc-15m.js
      - name: Python syntax
        run: python -m py_compile api/index.py api/engine_fixtures.py api/poly_us_15m.py
      - name: Fail-closed truth controls
        run: |
          grep -q 'SYNTHETIC MARKET' terminal/index.html
          grep -q 'execution_enabled.*False' api/index.py
          grep -q 'NOT CONNECTED' terminal/index.html
          test -f LICENSE
